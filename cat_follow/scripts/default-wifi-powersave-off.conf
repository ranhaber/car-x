# Disable WiFi power save for reliable DDS discovery/traffic on the ROCK 4D.
#
# Power save introduces latency spikes that make DDS multicast discovery and
# ROS 2 topic delivery flaky, which shows up as intermittent /scan and /cmd_vel
# stalls. Install as:
#   sudo install -m 0644 cat_follow/scripts/default-wifi-powersave-off.conf \
#     /etc/NetworkManager/conf.d/default-wifi-powersave-on.conf
#   sudo systemctl restart NetworkManager
[connection]
wifi.powersave = 2
