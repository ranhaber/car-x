<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Follow - Movement</title>
  <script defer src="/static/action_builder.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #0f3460; }
    header h1 { font-size: 1.3rem; color: #e94560; }
    header nav a { color: #a0a0c0; text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
    header nav a:hover, header nav a.active { color: #e94560; }
    main { flex: 1; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; }
    .panel { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .panel h2 { font-size: 0.95rem; color: #e94560; margin-bottom: 10px; }
    .notes { font-size: 0.82rem; color: #8888aa; margin-bottom: 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
    label { display: block; font-size: 0.72rem; color: #8888aa; text-transform: uppercase; margin-bottom: 4px; }
    input, select { background: #0f0f23; border: 1px solid #0f3460; color: #e0e0e0; padding: 8px 10px; border-radius: 4px; }
    button { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn { background: #0f3460; color: #e0e0e0; }
    .btn-run { background: #1e7a46; color: #fff; }
    .btn-stop { background: #e94560; color: #fff; font-size: 1.05rem; padding: 14px 24px; }
    .queue-item { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #0f3460; font-size: 0.9rem; }
    .queue-item code { background: #0f0f23; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
    .feedback { margin-top: 10px; padding: 8px 12px; border-radius: 4px; font-size: 0.85rem; }
    .feedback.ok { background: #1e4620; color: #6bdb6b; }
    .feedback.err { background: #4a1c1c; color: #e07070; }
    .status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; font-size: 0.85rem; }
    footer { text-align: center; padding: 10px; font-size: 0.7rem; color: #555; }
  </style>
</head>
<body>
<header>
  <h1>Cat Follow</h1>
  <nav>
    <a href="/">Control</a>
    <a href="/movement" class="active">Movement</a>
    <a href="/calibration">Calibration</a>
  </nav>
</header>

<main x-data="movementApp()" x-init="init()">
  <div class="panel">
    <h2>Shared action queue</h2>
    <p class="notes">
      Control and Calibration add steps here. This page is the only place that runs motor sequences.
      Heartbeat is sent automatically while a sequence runs.
    </p>
    <div class="status-grid">
      <div>Status: <strong x-text="sequenceStatus.status || 'idle'"></strong></div>
      <div>FSM: <strong x-text="sequenceStatus.fsm_state || '—'"></strong></div>
      <div>Step: <strong x-text="(sequenceStatus.action_index ?? 0) + '/' + (sequenceStatus.action_count ?? 0)"></strong></div>
      <div>Stop distance: <strong x-text="(sequenceStatus.obstacle_too_close_cm ?? '—') + ' cm'"></strong></div>
    </div>
  </div>

  <div class="panel">
    <h2>Add action</h2>
    <div class="row">
      <div>
        <label>Type</label>
        <select x-model="draftType" @change="setDraftType(draftType)">
          <option value="drive">drive</option>
          <option value="steer">steer</option>
          <option value="wait">wait</option>
          <option value="stop">stop</option>
        </select>
      </div>
      <template x-if="draft.type === 'drive'">
        <div class="row" style="margin:0;">
          <div><label>Direction</label><select x-model="draft.direction"><option value="forward">forward</option><option value="backward">backward</option></select></div>
          <div><label>Speed %</label><input type="number" min="1" max="50" x-model.number="draft.speed_pct"></div>
          <div><label>Duration s</label><input type="number" step="0.1" min="0.1" x-model.number="draft.duration_s"></div>
        </div>
      </template>
      <template x-if="draft.type === 'steer'">
        <div class="row" style="margin:0;">
          <div><label>Angle °</label><input type="number" min="-25" max="25" x-model.number="draft.angle_deg"></div>
          <div><label>Speed %</label><input type="number" min="1" max="50" x-model.number="draft.speed_pct"></div>
          <div><label>Duration s</label><input type="number" step="0.1" min="0.1" x-model.number="draft.duration_s"></div>
        </div>
      </template>
      <template x-if="draft.type === 'wait' || draft.type === 'stop'">
        <div><label>Duration s</label><input type="number" step="0.1" min="0.1" x-model.number="draft.duration_s"></div>
      </template>
      <button class="btn" @click="addDraftToQueue()">Add to queue</button>
    </div>
  </div>

  <div class="panel">
    <h2>Queue (<span x-text="queue.length"></span>)</h2>
    <template x-if="queue.length === 0">
      <p class="notes">Queue is empty. Add actions here or from Control / Calibration.</p>
    </template>
    <template x-for="(item, index) in queue" :key="index">
      <div class="queue-item">
        <code x-text="index + 1"></code>
        <span x-text="queueSummary(item)"></span>
        <button class="btn" style="margin-left:auto;" @click="moveQueueItemUp(index)" :disabled="index === 0">Up</button>
        <button class="btn" @click="removeQueueItem(index)">Remove</button>
      </div>
    </template>
    <div class="row" style="margin-top: 12px;">
      <button class="btn-run" @click="runActionQueue()" :disabled="queue.length === 0">Run sequence</button>
      <button class="btn-stop" @click="stopSequence()">STOP</button>
      <button class="btn" @click="clearActionQueue()" :disabled="queue.length === 0">Clear queue</button>
    </div>
    <div class="feedback" :class="builderFeedbackOk ? 'ok' : 'err'" x-show="builderFeedback" x-text="builderFeedback"></div>
  </div>
</main>

<footer>Cat Follow v{{ version }}</footer>

<script>
function movementApp() {
  return CatFollowActionBuilder.mixin({
    init() {
      this.initActionBuilder();
      this.startSequenceStatusPoll();
    },
  });
}
</script>
</body>
</html>
