# Nav2 parameters tuned for the PiCar-X on the ROCK 4D.
#
# Embedded profile: 2D lidar costmaps only (no voxel/3D layers), low update
# rates, and a Regulated Pure Pursuit controller suited to the car-like
# (Ackermann) chassis with a finite minimum turning radius.  Localization is
# provided by slam_toolbox on the saved yard_map (it publishes map->odom and
# /map), so no AMCL / map_server node is required here.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 20

controller_server:
  ros__parameters:
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.30
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      use_rotate_to_heading: false   # car-like: cannot rotate in place
      allow_reversing: false
      max_angular_accel: 2.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.30

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.12
      plugins: ["obstacle_layer", "range_sensor_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
      # HC-SR04 via sensor_msgs/Range. Disabling this layer for diagnosis MUST
      # NOT disable ultrasonic direct DecisionEngine safety (NAV-15).
      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ultrasonic_range"]
        input_sensor_type: "VARIABLE"
        clear_on_max_reading: true
        no_readings_timeout: 0.5
        mark_threshold: 0.8
        clear_threshold: 0.2
        inflate_cone: 1.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.12
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    # Nav2 BackUp recovery is intentionally omitted and must remain disabled.
    # The canonical target FSM has a separate DecisionEngine-owned
    # BRAKE_REVERSE recovery: stop, center, settle, then perform a tightly
    # bounded straight reverse with explicit retry and FAILSAFE rules. Nav2
    # must never initiate an independent reverse or bypass those checks.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"

# Nav2 command chain: controller_server -> /cmd_vel -> velocity_smoother ->
# /cmd_vel_smoothed. cat_follow's ros_bridge consumes the SMOOTHED output
# (CAT_FOLLOW_CMD_VEL_TOPIC, default "cmd_vel_smoothed") so it respects the
# accel/decel limits below rather than the raw controller command.
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 5.0
    # Nav2 remains forward-only. BRAKE_REVERSE bypasses Nav2 and is applied
    # only by DecisionEngine under the canonical bounded-recovery contract.
    max_velocity: [0.30, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
